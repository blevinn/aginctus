# Static analysis gate for the hermetic validation tier (#297).
#
# golangci-lint is the pinned carrier: nixpkgs no longer ships a standalone
# `staticcheck` attribute. Only staticcheck is enabled; `default: none` keeps
# every other linter out of the gate until it is deliberately added here.
version: "2"

run:
  timeout: 10m

linters:
  default: none
  enable:
    - staticcheck

issues:
  # Every occurrence must be reported. The defaults cap identical diagnostics
  # at three, which silently hides most of a repo-wide finding class.
  max-same-issues: 0
  max-issues-per-linter: 0