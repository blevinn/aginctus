name: hermetic

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hermetic-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hermetic:
    name: hermetic validation (ubuntu)
    # Probe the namespace contract instead of changing runner security policy.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      BUILD_HASH: ${{ github.sha }}
      NIX_CONFIG: experimental-features = nix-command flakes
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: require unprivileged namespace isolation
        id: namespaces
        run: |
          set -euo pipefail
          fixture=$(mktemp -d)
          trap 'rm -rf "$fixture"' EXIT
          mkdir "$fixture/source" "$fixture/target"
          touch "$fixture/source/namespace-marker"
          # Expand positional parameters inside the namespace shell.
          # shellcheck disable=SC2016
          if ! unshare --user --map-root-user --mount --fork -- bash -euc '
            mount --bind "$1/source" "$1/target"
            test -f "$1/target/namespace-marker"
          ' bash "$fixture"; then
            echo "::error::Required unprivileged user/root mapping and mount namespace bind mount unavailable. No privileged fallback or host policy changes are permitted."
            exit 1
          fi
          test ! -e "$fixture/target/namespace-marker"

      - name: install Nix
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
          enable_kvm: false

      - name: cache Go module cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: hermetic-go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum', 'flake.lock') }}

      # Temporary PR diagnostic: only static rule IDs for files touched by #533.
      - name: diagnose changed-file lint (temporary)
        run: |
          nix --quiet develop --no-update-lock-file -c ruff check --output-format concise scripts/acceptance/local_report.py scripts/acceptance/test_local_report.py || true
          nix --quiet develop --no-update-lock-file -c shellcheck -f gcc scripts/acceptance/opencode.sh scripts/acceptance/opencode-test.sh || true
          # End the temporary diagnostic run before expensive suites.
          exit 1

      - name: populate Go module cache
        run: nix --quiet develop --no-update-lock-file -c go mod download

      - name: hermetic suites (structured JSON)
        id: aggregate
        run: |
          set -euo pipefail
          # tee preserves the result even on failure; pipefail retains status.
          # Keep stdout as JSON, never merge raw subprocess stderr into it.
          nix --quiet develop --no-update-lock-file -c just check report-json | tee "$RUNNER_TEMP/check-ci.json"

      - name: gateway-config-parity flake check
        id: parity
        if: ${{ !cancelled() && steps.aggregate.outcome != 'skipped' }}
        run: nix --quiet build --no-update-lock-file .#checks.x86_64-linux.gateway-config-parity

      - name: release packaging preview (no tag or publish)
        id: release_preview
        run: nix --quiet develop --no-update-lock-file -c bash scripts/release/package.sh "$RUNNER_TEMP/release-preview"

      - name: diff check
        id: whitespace
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == pull_request ]]; then
            git diff --check "$BASE_SHA...HEAD"
          elif [[ "$EVENT_NAME" == push && "$BEFORE_SHA" != 0000000000000000000000000000000000000000 ]]; then
            git diff --check "$BEFORE_SHA" HEAD
          else
            git diff --check HEAD~ HEAD
          fi

      - name: report observed results
        if: always()
        env:
          NAMESPACE_RESULT: ${{ steps.namespaces.outcome }}
          AGGREGATE_RESULT: ${{ steps.aggregate.outcome }}
          PARITY_RESULT: ${{ steps.parity.outcome }}
          RELEASE_PREVIEW_RESULT: ${{ steps.release_preview.outcome }}
          WHITESPACE_RESULT: ${{ steps.whitespace.outcome }}
        run: |
          python3 scripts/checks/ci_summary.py
