name: hermetic

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Only superseded PR heads may cancel. Every push to main and explicit
# dispatch must produce independent, durable evidence for that revision.
concurrency:
  group: hermetic-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hermetic:
    name: hermetic validation (ubuntu)
    # Probe the namespace contract instead of changing runner security policy.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      BUILD_HASH: ${{ github.sha }}
      NIX_CONFIG: experimental-features = nix-command flakes
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: require unprivileged namespace isolation
        id: namespaces
        run: |
          set -euo pipefail
          fixture=$(mktemp -d)
          trap 'rm -rf "$fixture"' EXIT
          mkdir "$fixture/source" "$fixture/target"
          touch "$fixture/source/namespace-marker"
          # Expand positional parameters inside the namespace shell.
          # shellcheck disable=SC2016
          if ! unshare --user --map-root-user --mount --fork -- bash -euc '
            mount --bind "$1/source" "$1/target"
            test -f "$1/target/namespace-marker"
          ' bash "$fixture"; then
            echo "::error::Required unprivileged user/root mapping and mount namespace bind mount unavailable. No privileged fallback or host policy changes are permitted."
            exit 1
          fi
          test ! -e "$fixture/target/namespace-marker"

      - name: install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
          enable_kvm: false

      - name: cache Go module cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: hermetic-go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum', 'flake.lock') }}

      - name: populate Go module cache
        run: nix --quiet develop --no-update-lock-file -c go mod download

      - name: hermetic suites (structured JSON)
        id: aggregate
        run: |
          set -euo pipefail
          # tee preserves the result even on failure; pipefail retains status.
          # Keep stdout as JSON, never merge raw subprocess stderr into it.
          nix --quiet develop --no-update-lock-file -c just check report-json | tee "$RUNNER_TEMP/check-ci.json"

      - name: gateway-config-parity flake check
        id: parity
        if: ${{ !cancelled() && steps.aggregate.outcome != 'skipped' }}
        run: nix --quiet build --no-update-lock-file .#checks.x86_64-linux.gateway-config-parity

      - name: release packaging preview (no tag or publish)
        id: release_preview
        run: nix --quiet develop --no-update-lock-file -c bash scripts/release/package.sh "$RUNNER_TEMP/release-preview"

      - name: diff check
        id: whitespace
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == pull_request ]]; then
            git diff --check "$BASE_SHA...HEAD"
          elif [[ "$EVENT_NAME" == push && "$BEFORE_SHA" != 0000000000000000000000000000000000000000 ]]; then
            git diff --check "$BEFORE_SHA" HEAD
          else
            git diff --check HEAD~ HEAD
          fi

      - name: report observed results
        if: always()
        env:
          NAMESPACE_RESULT: ${{ steps.namespaces.outcome }}
          AGGREGATE_RESULT: ${{ steps.aggregate.outcome }}
          PARITY_RESULT: ${{ steps.parity.outcome }}
          RELEASE_PREVIEW_RESULT: ${{ steps.release_preview.outcome }}
          WHITESPACE_RESULT: ${{ steps.whitespace.outcome }}
        run: |
          python3 scripts/checks/ci_summary.py

  # Advisory while the legacy required gate runs; #708 will convert the
  # existing required context into a fail-closed aggregator.
  go-fast:
    name: go tests and staticcheck (ubuntu)
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      AGINCTUS_INCUS_INTEGRATION: "0"
      AGINCTUS_INCUS_DISPOSABLE: "NO"
      AGINCTUS_ACCEPTANCE_LIVE: ""
      AGINCTUS_ACCEPTANCE_LIVE_HOOKS: ""
      ACCEPTANCE_TEST_FAIL: ""
      GOFLAGS: ""
      GOTOOLCHAIN: local
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install pinned Go
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version-file: go.mod
          cache: true
      - name: populate Go modules
        run: go mod download
      - name: verify Go modules
        env:
          GOPROXY: "off"
          GOSUMDB: "off"
        run: go mod verify
      - name: Go unit tests
        env:
          GOPROXY: "off"
          GOSUMDB: "off"
        run: go test ./...
      - name: Go vet
        env:
          GOPROXY: "off"
          GOSUMDB: "off"
        run: go vet ./...
      - name: Go staticcheck (same config as Nix check lint)
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9.2.0
        with:
          version: v2.15.0
          only-new-issues: false
      - name: Markdown library for generated help validation
        run: python3 -m pip install --disable-pip-version-check --user "markdown-it-py==4.0.0"
      - name: Documented CLI examples (no command execution)
        env:
          GOPROXY: "off"
          GOSUMDB: "off"
        run: |
          set -euo pipefail
          go run ./cmd/aginctus help | python3 scripts/check_docs_examples.py

  static-fast:
    name: python shell and docs (ubuntu)
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    env:
      AGINCTUS_INCUS_INTEGRATION: "0"
      AGINCTUS_INCUS_DISPOSABLE: "NO"
      AGINCTUS_ACCEPTANCE_LIVE: ""
      AGINCTUS_ACCEPTANCE_LIVE_HOOKS: ""
      ACCEPTANCE_TEST_FAIL: ""
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install pinned Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - name: install Python check tools
        run: python3 -m pip install --disable-pip-version-check "markdown-it-py==4.0.0" "ruff==0.14.3"
      - name: Ruff lint
        run: ruff check .
      - name: Python unit suites
        run: |
          set -euo pipefail
          for path in scripts/vm_harness guest/opencode guest/ssh scripts/acceptance scripts/gateway tests; do
            python3 -m unittest discover -s "$path" -p 'test_*.py' -v
          done
      - name: shellcheck
        run: |
          set -euo pipefail
          command -v shellcheck
          git ls-files -z -- '*.sh' | xargs -0 -r -n1 shellcheck
      - name: shell parser check
        run: |
          set -euo pipefail
          git ls-files -z -- '*.sh' | xargs -0 -r -n1 bash -n
      - name: shell adapter tests (synthetic only)
        run: |
          set -euo pipefail
          bash scripts/acceptance/opencode-test.sh
          bash scripts/acceptance/opencode-live-adapter-test.sh
      - name: local Markdown links
        run: python3 scripts/check_markdown_links.py

  # A failed/ambiguous selector must never exempt a Nix-sensitive change.
  # This separate result is advisory until the required gate migrates in #709.
  changes:
    name: classify PR Nix applicability
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      nix_required: ${{ steps.classify.outputs.nix_required }}
    steps:
      - name: checkout full PR merge tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: classify changed paths (fail closed)
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/checks/ci_select.py --base "$BASE_SHA"

  nix-contracts:
    name: targeted Nix security contracts (ubuntu)
    needs: changes
    # Explicitly evaluate on selector failure, which also fails the gate.
    # A clean docs-only diff is the sole exemption.
    if: ${{ always() && github.event_name == 'pull_request' && needs.changes.outputs.nix_required != 'false' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      NIX_CONFIG: experimental-features = nix-command flakes
      AGINCTUS_INCUS_INTEGRATION: "0"
      AGINCTUS_INCUS_DISPOSABLE: "NO"
      AGINCTUS_ACCEPTANCE_LIVE: ""
      AGINCTUS_ACCEPTANCE_LIVE_HOOKS: ""
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: require unprivileged namespace isolation
        run: |
          set -euo pipefail
          # Do not weaken this contract or alter runner security settings.
          unshare --user --map-root-user --mount --fork -- true
      - name: install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
          enable_kvm: false
      - name: build NixOS Home Manager and gateway security contracts
        run: |
          nix --quiet build --no-update-lock-file --no-link \
            .#checks.x86_64-linux.nixos-module \
            .#checks.x86_64-linux.home-manager-module \
            .#checks.x86_64-linux.operator-settings-parity \
            .#checks.x86_64-linux.gateway-config-parity \
            .#checks.x86_64-linux.opencode-workload-socket-alignment \
            .#checks.x86_64-linux.testenv-incus-vm-image-config \
            .#checks.x86_64-linux.testenv-recovery-worker-policy \
            .#checks.x86_64-linux.testenv-installed-worker-policy
