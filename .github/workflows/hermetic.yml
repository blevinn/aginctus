# Hermetic validation CI for Aginctus.
#
# Closes #360, depends on #347 / PR #356 which adds `just check-all`.
# Runs the supported hermetic validation tier on Linux without granting
# production credentials, third-party tokens, or live Incus/host access.
#
# Pinning policy: actions are SHA-pinned with a trailing version comment
# so a future supply-chain audit can verify the commit. Dependabot
# (see .github/dependabot.yml) opens PRs that refresh the pins; reviewers
# must treat those bumps as supply-chain input, not routine maintenance.
#
# Action selection: cachix/install-nix-action v31 is used because the
# older nixos/nix-action is deprecated and the DeterminateSystems
# installer relies on sudo and a separate flake that this repository
# does not consume. The community cachix/action is the maintained
# successor for plain Nix installations on bare GitHub runners and is
# already what most Nix projects in the same tier pin to.
name: hermetic

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Least-privilege default: read-only access to repository contents.
# The job does not need to write, comment, deploy, or push anything.
permissions:
  contents: read

# Cancel any in-flight re-runs for the same ref so a force-push or new
# push to a PR does not leave multiple hermetic runs queueing.
concurrency:
  group: hermetic-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hermetic:
    name: hermetic validation (ubuntu)
    runs-on: ubuntu-latest
    # Conservative cap. The full aggregate is dominated by Nix evaluation
    # plus a single NixOS gateway parity build; 45 minutes is well above
    # the expected first-run cost on a cold /nix/ store.
    timeout-minutes: 45
    env:
      BUILD_HASH: ${{ github.sha }}
      NIX_CONFIG: experimental-features = nix-command flakes
    steps:
      - name: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Full history enables the `git diff --check HEAD~ HEAD` step
          # and records the exact checkout SHA for provenance.
          fetch-depth: 0

      - name: record checkout SHA
        id: build-hash
        run: |
          {
            echo "## Hermetic CI"
            echo
            echo "- checkout SHA: \`$BUILD_HASH\`"
            echo "- runner: ${{ runner.os }}"
            echo "- action: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 (v31)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: install Nix
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31
        with:
          # cachix/install-nix-action v31 already enables nix-command and
          # flakes by default. Repeating the setting explicitly pins the
          # experimental features across future installer versions and
          # keeps the dependency narrow (no Cachix push, no extra channel).
          extra_nix_config: |
            experimental-features = nix-command flakes
          # Disable KVM probing: this job does not run NixOS VMs.
          enable_kvm: false

      - name: cache Go module cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          # Invalidate the cache when go.sum changes; a stale module cache
          # would make `just check-all` (which forces GOPROXY=off) fail.
          key: hermetic-go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            hermetic-go-${{ runner.os }}-

      - name: populate Go module cache
        # `check-all` runs with GOPROXY=off to forbid dependency drift;
        # populate the module cache online in this step before the
        # offline aggregate. A restored cache makes this a no-op.
        run: nix --quiet develop -c go mod download

      - name: just check-all
        run: nix --quiet develop -c just check-all

      - name: gateway-config-parity flake check
        run: nix --quiet build --no-update-lock-file .#checks.x86_64-linux.gateway-config-parity

      - name: diff check
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            git fetch --no-tags --depth=1 origin "${BASE_REF}"
            git diff --check "origin/${BASE_REF}...HEAD"
          else
            git diff --check HEAD~ HEAD
          fi

      - name: report expected skips
        if: always()
        run: |
            {
              echo "### Expected skips"
              echo
              echo "GitHub-hosted ubuntu-latest runners do not provide"
              echo "\`/etc/subuid\` entries, so unprivileged user namespace"
              echo "UID mapping is unavailable. The three guest SSH"
              echo "host-trust tests that require non-root UID mapping"
              echo "therefore report skips with"
              echo "\`namespace UID mapping unavailable on this host\`:"
              echo
              echo "- test_rejects_non_root_owned_trust_directory"
              echo "- test_rejects_non_root_owned_state_root"
              echo "- test_rejects_non_root_owned_known_hosts"
              echo
              echo "These skips are expected, not failures, and are"
              echo "tallied as unittest skips rather than passes. The"
              echo "suite never falls back to host-root execution."
              echo "Discovery counts come from the \`just check-all\`"
              echo "step output above."
            } >> "$GITHUB_STEP_SUMMARY"