name: hermetic

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hermetic-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hermetic:
    name: hermetic validation (ubuntu)
    # Probe the namespace contract instead of changing runner security policy.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      BUILD_HASH: ${{ github.sha }}
      NIX_CONFIG: experimental-features = nix-command flakes
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: require unprivileged namespace isolation
        id: namespaces
        run: |
          set -euo pipefail
          fixture=$(mktemp -d)
          trap 'rm -rf "$fixture"' EXIT
          mkdir "$fixture/source" "$fixture/target"
          touch "$fixture/source/namespace-marker"
          # Expand positional parameters inside the namespace shell.
          # shellcheck disable=SC2016
          if ! unshare --user --map-root-user --mount --fork -- bash -euc '
            mount --bind "$1/source" "$1/target"
            test -f "$1/target/namespace-marker"
          ' bash "$fixture"; then
            echo "::error::Required unprivileged user/root mapping and mount namespace bind mount unavailable. No privileged fallback or host policy changes are permitted."
            exit 1
          fi
          test ! -e "$fixture/target/namespace-marker"

      - name: install Nix
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
          enable_kvm: false

      - name: cache Go module cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: hermetic-go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum', 'flake.lock') }}

      - name: populate Go module cache
        run: nix --quiet develop --no-update-lock-file -c go mod download

      - name: just check-lint
        id: lint
        run: nix --quiet develop --no-update-lock-file -c just check-lint

      - name: just check-all
        id: aggregate
        run: |
          set -euo pipefail
          nix --quiet develop --no-update-lock-file -c just check-all 2>&1 | tee "$RUNNER_TEMP/check-all.log"

      - name: gateway-config-parity flake check
        id: parity
        if: ${{ !cancelled() && steps.aggregate.outcome != 'skipped' }}
        run: nix --quiet build --no-update-lock-file .#checks.x86_64-linux.gateway-config-parity

      - name: diff check
        id: whitespace
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == pull_request ]]; then
            git diff --check "$BASE_SHA...HEAD"
          elif [[ "$EVENT_NAME" == push && "$BEFORE_SHA" != 0000000000000000000000000000000000000000 ]]; then
            git diff --check "$BEFORE_SHA" HEAD
          else
            git diff --check HEAD~ HEAD
          fi

      - name: report observed results
        if: always()
        env:
          NAMESPACE_RESULT: ${{ steps.namespaces.outcome }}
          LINT_RESULT: ${{ steps.lint.outcome }}
          AGGREGATE_RESULT: ${{ steps.aggregate.outcome }}
          PARITY_RESULT: ${{ steps.parity.outcome }}
          WHITESPACE_RESULT: ${{ steps.whitespace.outcome }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          log = Path(os.environ['RUNNER_TEMP']) / 'check-all.log'
          lines = log.read_text(errors='replace').splitlines() if log.exists() else []
          observed = [line for line in lines if re.match(r'^(test_.* \.\.\. |Ran \d+ tests? in |OK\b|FAILED\b)', line)]
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## Hermetic CI\n\n')
              summary.write(f"Checkout: `{os.environ['BUILD_HASH']}`\n\n")
              for label, key in [('Namespace contract', 'NAMESPACE_RESULT'), ('Lint', 'LINT_RESULT'), ('check-all', 'AGGREGATE_RESULT'), ('Gateway parity', 'PARITY_RESULT'), ('Whitespace', 'WHITESPACE_RESULT')]:
                  summary.write(f'- {label}: {os.environ[key]}\n')
              summary.write('\n### Observed Python results (partial if aggregate failed)\n\n```text\n')
              summary.write('\n'.join(observed) if observed else 'No Python test results observed; inspect step logs.')
              summary.write('\n```\n\nGo and shell command results are in the aggregate log. Suites after its first failure did not run.\n')
          PY
