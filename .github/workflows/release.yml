name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: validate release source
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      NIX_CONFIG: experimental-features = nix-command flakes
    steps:
      - name: checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: verify annotated tag, main ancestry and release collateral
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test "$(git cat-file -t "refs/tags/$TAG")" = tag
          tagged_commit="$(git rev-parse "refs/tags/$TAG^{commit}")"
          test "$tagged_commit" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$tagged_commit" origin/main
          python3 scripts/release/check.py --tag "$TAG"

      - name: install pinned Nix environment
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
          enable_kvm: false

      - name: populate Go modules
        run: nix --quiet develop --no-update-lock-file -c go mod download

      - name: hermetic validation
        run: nix --quiet develop --no-update-lock-file -c just check-all

      - name: gateway Nix/Go configuration parity
        run: nix --quiet build --no-update-lock-file --no-link .#checks.x86_64-linux.gateway-config-parity

      - name: packaged Nix CLI
        run: nix --quiet build --no-update-lock-file --no-link .#aginctus

      - name: whitespace check
        run: git diff --check HEAD^

  draft:
    name: build assets and create draft
    needs: validate
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    environment: release-draft
    permissions:
      contents: write
    env:
      NIX_CONFIG: experimental-features = nix-command flakes
      TAG: ${{ github.ref_name }}
    steps:
      - name: checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: recheck release collateral
        run: python3 scripts/release/check.py --tag "$TAG"

      - name: install pinned Nix environment
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
          enable_kvm: false

      - name: build Linux amd64 archive and checksum
        run: |
          set -euo pipefail
          nix --quiet develop --no-update-lock-file -c go mod download
          nix --quiet develop --no-update-lock-file -c bash scripts/release/package.sh dist
          test -f "dist/aginctus-$TAG-linux-amd64.tar.gz"

      - name: create draft release, never overwrite existing release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists; never overwrite assets or notes."
            exit 1
          fi
          flags=(--draft --verify-tag --title "Aginctus $TAG" --notes-file "docs/releases/$TAG.md")
          if [[ "$TAG" == *-rc.* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$TAG" "${flags[@]}" \
            "dist/aginctus-$TAG-linux-amd64.tar.gz" dist/SHA256SUMS
