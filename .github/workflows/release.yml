name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: validate release source
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      NIX_CONFIG: experimental-features = nix-command flakes
    steps:
      - name: checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: verify annotated tag, main ancestry and release collateral
        env:
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git cat-file -t "refs/tags/$TAG")" = tag
          test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$COMMIT"
          git merge-base --is-ancestor "$COMMIT" origin/main
          python3 scripts/release/check.py --tag "$TAG"

      - name: install pinned Nix environment
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
          enable_kvm: false

      - name: populate Go modules
        run: nix --quiet develop --no-update-lock-file -c go mod download

      - name: hermetic validation
        run: nix --quiet develop --no-update-lock-file -c just check-all

      - name: gateway Nix/Go configuration parity
        run: nix --quiet build --no-update-lock-file --no-link .#checks.x86_64-linux.gateway-config-parity

      - name: packaged Nix CLI
        run: nix --quiet build --no-update-lock-file --no-link .#aginctus

      - name: whitespace check
        run: git diff --check HEAD^

  draft:
    name: build assets and create draft
    needs: validate
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    environment: release-draft
    permissions:
      contents: write
    env:
      NIX_CONFIG: experimental-features = nix-command flakes
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
      BUILD_SHA: ${{ github.sha }}
    steps:
      - name: checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: recheck release collateral
        run: python3 scripts/release/check.py --tag "$TAG"

      - name: install pinned Nix environment
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
          enable_kvm: false

      - name: build Linux amd64 archive and checksum
        run: |
          set -euo pipefail
          nix --quiet develop --no-update-lock-file -c go mod download
          mkdir -p dist/stage
          nix --quiet develop --no-update-lock-file -c env CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -buildvcs=false \
            -ldflags "-buildid= -X=github.com/blevinn/aginctus/internal/cli.Revision=$BUILD_SHA" \
            -o dist/stage/aginctus ./cmd/aginctus
          test "$(dist/stage/aginctus --version)" = "aginctus ${TAG#v} (revision $BUILD_SHA)"
          cp LICENSE README.md dist/stage/
          archive="aginctus-$TAG-linux-amd64.tar.gz"
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner \
            -C dist/stage -cf - . | gzip -n > "dist/$archive"
          (cd dist && sha256sum "$archive" > SHA256SUMS && sha256sum -c SHA256SUMS)

      - name: create draft release, never overwrite existing release
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists; never overwrite assets or notes."
            exit 1
          fi
          flags=(--draft --verify-tag --title "Aginctus $TAG" --notes-file "docs/releases/$TAG.md")
          if [[ "$TAG" == *-rc.* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$TAG" "${flags[@]}" \
            "dist/aginctus-$TAG-linux-amd64.tar.gz" dist/SHA256SUMS
